name: Release

# Publishing a GitHub release runs the checks, then publishes every package in packages/ to npm
# at the version in its package.json. Versions already on npm are skipped, so a re-run is safe.
# To release: bump "version" in every packages/*/package.json, push, then publish a release tagged v<version>.
#
# Uses npm trusted publishing, so no npm token is stored in GitHub. Set up once per package on
# npmjs.com: package Settings → Trusted publishing → GitHub Actions, workflow `release.yml`.
on:
  release:
    types: [published]
  # Adds a "Run workflow" button on the Actions tab to publish without a new release.
  workflow_dispatch:

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      # Lets npm verify this workflow and add a provenance statement to each package.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, which supports trusted publishing.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # pnpm pack swaps in publishConfig (dist/ exports) and real versions for workspace:*;
      # npm then publishes that tarball. Dependencies come first, so ai-core goes before the modules.
      - name: Publish packages
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          for dir in $(pnpm -r --filter './packages/*' exec pwd); do
            name=$(node -p "require('$dir/package.json').name")
            version=$(node -p "require('$dir/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already on npm, skipping"
              continue
            fi
            (cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/packs" > /dev/null)
            npm publish "$RUNNER_TEMP/packs/$name-$version.tgz" --access public --ignore-scripts
          done
