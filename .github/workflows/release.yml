name: Release

# Publishing a GitHub release runs the checks, then publishes the one npm package, payload-ai-suite,
# assembled from all the workspace packages (see scripts/assemble-package.mjs). If its version is
# already on npm, nothing is published, so a re-run is safe.
# To release: bump "version" in packages/ai-suite/package.json, push, then publish a release tagged v<version>.
#
# Uses npm trusted publishing, so no npm token is stored in GitHub. Set up once on npmjs.com:
# payload-ai-suite Settings → Trusted publishing → GitHub Actions, workflow `release.yml`.
on:
  release:
    types: [published]
  # Adds a "Run workflow" button on the Actions tab to publish without a new release.
  workflow_dispatch:

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      # Lets npm verify this workflow and add a provenance statement to the package.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, which supports trusted publishing.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm package

      - name: Publish payload-ai-suite
        working-directory: .release/payload-ai-suite
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "payload-ai-suite@$version" version > /dev/null 2>&1; then
            echo "payload-ai-suite@$version is already on npm, nothing to publish"
          else
            npm publish --access public --ignore-scripts
          fi
