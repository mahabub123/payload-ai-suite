name: Nightly (real models)

# Recorded real-model eval runs. Costs money: runs only on schedule / manual dispatch,
# never on pull requests, and needs the provider secrets.
on:
  schedule:
    - cron: '30 20 * * *' # 02:30 Asia/Dhaka
  workflow_dispatch:
    inputs:
      routes:
        description: 'JSON list of chat routes to evaluate'
        default: '["anthropic:claude-sonnet-5-5","openai:gpt-5-mini"]'

permissions:
  contents: read

jobs:
  evals:
    name: Evals · ${{ matrix.route }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        route: ${{ fromJSON(github.event.inputs.routes || '["anthropic:claude-sonnet-5-5","openai:gpt-5-mini"]') }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: payload_ai_store
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U payload"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URI: postgres://payload:payload@localhost:5432/payload_ai_store
      PAYLOAD_SECRET: ${{ secrets.NIGHTLY_PAYLOAD_SECRET || 'nightly-secret-0123456789abcdef0123456789' }}
      PAYLOAD_DB_PUSH: '0'
      AI_MOCK: '0'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AI_ROUTE_CHAT: ${{ matrix.route }}
      AI_ROUTE_FAST: ${{ matrix.route }}
      AI_ROUTE_WRITE: ${{ matrix.route }}
      AI_ROUTE_EMBED: openai:text-embedding-3-small
      AI_MONTHLY_BUDGET_MICROS: '20000000' # $20 hard stop per nightly run
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dev-store payload migrate
      - run: pnpm --filter dev-store seed
      - run: pnpm --filter dev-store build
      - name: Start dev-store with the real route
        run: |
          pnpm --filter dev-store start > dev-store.log 2>&1 &
          npx wait-on -t 120000 http://localhost:3000/admin
      - name: Wait for the knowledge/offering index jobs
        run: sleep 90
      - name: Live evals (recorded)
        id: evals
        run: |
          SAFE=$(echo '${{ matrix.route }}' | tr ':/' '__')
          echo "safe=$SAFE" >> "$GITHUB_OUTPUT"
          pnpm evals --mode live --target http://localhost:3000 --route '${{ matrix.route }}' \
            --record "recording-$SAFE.json" --report "report-$SAFE.json" --concurrency 2
      - name: Red-team (real model)
        if: always()
        run: pnpm --filter @payload-ai-suite/tooling redteam --target http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-${{ steps.evals.outputs.safe || strategy.job-index }}
          path: |
            recording-*.json
            report-*.json
            dev-store.log
          retention-days: 30

  load:
    name: Load (k6, delayed-stream mock)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: payload_ai_store
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U payload"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URI: postgres://payload:payload@localhost:5432/payload_ai_store
      PAYLOAD_SECRET: load-secret-0123456789abcdef0123456789ab
      PAYLOAD_DB_PUSH: '0'
      AI_MOCK: '1'
      AI_MOCK_DELAY_MS: '40'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dev-store payload migrate
      - run: pnpm --filter dev-store seed
      - run: pnpm --filter dev-store build
      - run: |
          pnpm --filter dev-store start > dev-store.log 2>&1 &
          npx wait-on -t 120000 http://localhost:3000/admin
      - uses: grafana/setup-k6-action@v1
      - run: k6 run -e BASE_URL=http://localhost:3000 tooling/load/k6-search.js
      - run: k6 run -e BASE_URL=http://localhost:3000 tooling/load/k6-assistant.js
