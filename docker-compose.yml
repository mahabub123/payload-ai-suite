services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: payload_ai_store
    ports: ['5433:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
  mailpit:
    image: axllent/mailpit:latest
    ports: ['8025:8025', '1025:1025']
volumes:
  pgdata:
